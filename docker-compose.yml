services:
  ollama:
    image: ollama/ollama:latest
    container_name: rag_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  bot:
    build: .
    container_name: rag_bot
    depends_on:
      - ollama
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      RAG_OLLAMA_MODEL: llama3.1
    stdin_open: true
    tty: true

volumes:
  ollama_data:
